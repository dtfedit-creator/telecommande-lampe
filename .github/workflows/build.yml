name: Construire l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compiler
        run: gradle assembleDebug --no-daemon

      - name: Renommer
        run: cp app/build/outputs/apk/debug/app-debug.apk TelecommandeLampe.apk

      - name: Publier
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Télécommande Lampe v${{ github.run_number }}
          files: TelecommandeLampe.apk
          make_latest: true
